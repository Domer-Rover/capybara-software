# config/zed2i_yaml
# Parameters for Stereolabs zed2i camera

---
/**:
    ros__parameters:
        general:
            camera_model: 'zed2i'
            camera_name: 'zed2i' # overwritten by launch file
            grab_resolution: 'HD720' # The native camera grab resolution. 'HD2K', 'HD1080', 'HD720', 'VGA', 'AUTO'
            grab_frame_rate: 30 # ZED SDK internal grabbing rate — VGA supports 30fps on ZED2i

        depth:
            min_depth: 0.2 # SDK 5.2 minimum valid value — ZED2i physical minimum is ~0.2m
            max_depth: 15.0 # Min: 0.5, Max: 20.0

