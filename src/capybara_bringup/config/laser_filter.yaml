scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: front_180_only
      type: laser_filters/LaserScanAngularBoundsFilter
      params:
        # LIDAR is mounted rotated 90° CCW from rover frame (laser 0° = rover's +y / left).
        # So to keep rover's FRONT 180°, keep laser angles [-π, 0] = right → front → left.
        # Proper fix later: add rpy="0 0 -1.5708" to laser_joint in URDF.
        lower_angle: -3.1416   # -180° laser = rover's right side edge
        upper_angle:  0.0      #    0° laser = rover's left side edge
