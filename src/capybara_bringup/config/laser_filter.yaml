scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: front_180_only
      type: laser_filters/LaserScanAngularBoundsFilter
      params:
        # LIDAR is mounted rotated 90° CCW from rover frame (laser 0° = rover's +y / left).
        # LD06 scan range is [0, 2π], NOT [-π, +π].
        # Laser 0° = rover left, π/2 = rover front, π = rover right.
        # Keep [0, π] to pass left-edge → front → right-edge (front 180°).
        # Proper fix later: add rpy="0 0 -1.5708" to laser_joint in URDF.
        lower_angle: 0.0       #   0° laser = rover's left side edge
        upper_angle: 3.1416    # 180° laser = rover's right side edge
