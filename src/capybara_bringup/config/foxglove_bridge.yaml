# Foxglove bridge config for SLAM and Nav2 launches.
# Stripped to essentials only — no depth, no point cloud, no OD, no aruco.
# Camera feed via ffmpeg (H.264) only — most bandwidth-efficient over 2.4GHz WiFi.
# port is NOT set here — overridden per-launch via foxglove_port launch arg.
/**:
    ros__parameters:
        address: '0.0.0.0'
        num_threads: 2
        max_qos_depth: 1
        send_buffer_limit: 10485760  # 10 MB — drop old frames, no lag accumulation

        topic_whitelist:
            # ── Core transforms & robot model ──────────────────────────────
            - '/tf'
            - '/tf_static'
            - '/robot_description'

            # ── ZED VIO — odometry and tracking health only ─────────────────
            - '/zed/zed_node/odom'
            - '/zed/zed_node/pose/status'

            # ── ZED camera feed — H.264 only (most efficient over WiFi) ────
            - '/zed/zed_node/rgb/color/rect/image/ffmpeg'
            - '/zed/zed_node/rgb/color/rect/camera_info'

            # ── Drive controller ───────────────────────────────────────────
            - '/diff_drive_controller/cmd_vel_unstamped'

            # ── LIDAR scan ─────────────────────────────────────────────────
            - '/scan'

            # ── SLAM map ───────────────────────────────────────────────────
            - '/map'

            # ── Nav2 — goals, paths, costmaps, footprints ──────────────────
            - '/goal_pose'
            - '/plan'
            - '/local_plan'
            - '/local_costmap/costmap'
            - '/local_costmap/published_footprint'
            - '/global_costmap/costmap'
            - '/global_costmap/published_footprint'
            - '/navigate_to_pose/.*'

            # ── Diagnostics ────────────────────────────────────────────────
            - '/rosout'
