# Foxglove bridge shared configuration for all Capybara launch files.
# port is NOT set here — it is overridden per-launch via the foxglove_port launch arg.
#
# topic_whitelist: only these topics are forwarded to Foxglove clients.
# Covers every topic needed across all launch files:
#   capybara_foxglove  · capybara_nav2_simple  · capybara_nav2_zed
#   capybara_nav2      · capybara_slam
# Patterns are regex — trailing .* matches all subtopics.
/**:
    ros__parameters:
        address: '0.0.0.0'
        num_threads: 4
        max_qos_depth: 1          # Latest message only — no frame queuing, no lag over WiFi
        send_buffer_limit: 10485760  # 10 MB: drop old frames instead of buffering

        topic_whitelist:
            # ── Core transforms & robot model ──────────────────────────────
            - '/tf'
            - '/tf_static'
            - '/robot_description'
            - '/joint_states'

            # ── Drive controller ───────────────────────────────────────────
            # cmd_vel_unstamped: what Nav2 (or teleop) is actually commanding
            - '/diff_drive_controller/cmd_vel_unstamped'

            # ── ZED2i — video feed (compressed only), odometry, IMU ────────
            # Use /compressed in Foxglove image panel — NOT the raw topic.
            # Raw 1080p will saturate 2.4GHz instantly.
            - '/zed/zed_node/left/image_rect_color/compressed'
            - '/zed/zed_node/left/camera_info'
            - '/zed/zed_node/odom'
            - '/zed/zed_node/pose'
            - '/zed/zed_node/imu/data'

            # ── LIDAR ───────────────────────────────────────────────────────
            - '/scan'

            # ── Nav2 — goals, plans, costmaps, footprints, status ──────────
            # These are all small/low-rate — safe to forward at full fidelity.
            - '/goal_pose'
            - '/plan'
            - '/local_plan'
            - '/local_costmap/costmap'
            - '/local_costmap/published_footprint'
            - '/global_costmap/costmap'
            - '/global_costmap/published_footprint'
            - '/navigate_to_pose/.*'

            # ── Diagnostics ────────────────────────────────────────────────
            - '/diagnostics'
            - '/rosout'
            # in the future we add david's node's topics here too