# Foxglove bridge config for object detection monitoring.
# Strips out point cloud, depth, nav, and SLAM topics — only the feeds
# needed to inspect ArUco and YOLO detection output.
/**:
    ros__parameters:
        address: '0.0.0.0'
        num_threads: 2
        max_qos_depth: 1
        send_buffer_limit: 10485760

        topic_whitelist:
            # ── Core transforms & robot model ──────────────────────────────
            - '/tf'
            - '/tf_static'
            - '/robot_description'

            # ── ZED left image (source for both detectors) ─────────────────
            - '/zed/zed_node/left/image_rect_color'
            - '/zed/zed_node/left/camera_info'

            # ── ArUco marker detection ─────────────────────────────────────
            - '/aruco/image_debug'
            - '/aruco/markers'
            - '/aruco/marker_distance'

            # ── YOLOv8 object detection ────────────────────────────────────
            - '/yolo/image_debug'

            # ── Diagnostics ────────────────────────────────────────────────
            - '/rosout'