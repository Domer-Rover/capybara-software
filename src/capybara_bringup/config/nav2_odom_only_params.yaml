# Nav2 config for odom-only navigation (no map, no AMCL).
# Uses rolling costmaps in the odom frame for obstacle detection.
# Stack: Smac Hybrid-A* (kinematically feasible paths) + RPP (geometric follower).
# The Hybrid-A* choice avoids in-place rotations that stall the weight-biased rover.

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_footprint
    odom_topic: /zed/zed_node/odom
    transform_tolerance: 2.0  # covers ZED TF startup delay (~1-2s after launch)
    default_server_timeout: 20
    default_cancel_timeout: 50
    introspection_mode: "disabled"
    always_reload_bt_xml: false
    bt_log_idle_transitions: false
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path
    waypoint_statuses_blackboard_id: waypoint_statuses
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001   # diff drive — Y velocity is always ~0
    min_theta_velocity_threshold: 0.001
    failure_timeout: 0.3
    odom_topic: "odom"
    odom_duration: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    path_handler_plugins: ["PathHandler"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_timeout: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      path_length_tolerance: 1.0
      stateful: True

    FollowPath:
      # Regulated Pure Pursuit — paired with Smac Hybrid-A* for exact path tracking.
      # Geometric controller; robust to open-loop duty-cycle hardware imprecision.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.2
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_goal: 1.0
      use_regulated_linear_velocity_scaling: true       # slows on curves — grass stability
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: true  # slows near inflation potential field
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: false       # rover can't pivot cleanly; Hybrid-A* paths start tangent
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 0.7
      max_robot_pose_search_dist: 10.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    introspection_mode: "disabled"
    planner_plugins: ["GridBased"]
    GridBased:
      # Smac Hybrid-A* — kinematically feasible paths using a minimum turning radius.
      # Avoids in-place rotations; paths start tangent to current heading.
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.5
      motion_model_for_search: "DUBIN"           # forward-only, matches allow_reversing:false
      angle_quantization_bins: 72                # 5° per bin
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.4                # TUNE: shrink if walkways too tight
      reverse_penalty: 2.1
      change_penalty: 0.15
      non_straight_penalty: 1.20
      cost_penalty: 1.30
      retrospective_penalty: 0.015
      lookup_table_size: 20
      cache_obstacle_heuristic: false            # rolling odom costmap, can't cache
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.4

# Both costmaps use odom frame with rolling windows — no static map needed.
# Footprint: rectangular bounding box sized for the rear axle (widest point).
#   X half-length: base_length/2 (0.3556m) + margin → 0.40m
#   Y half-width:  rear_wheel_separation/2 (0.4572m) + half wheel width → 0.51m
global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.03
      update_frequency: 5.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      global_frame: odom
      robot_base_frame: base_footprint
      footprint: "[[-0.40, -0.51], [-0.40, 0.51], [0.40, 0.51], [0.40, -0.51]]"
      resolution: 0.05
      rolling_window: true
      width: 20
      height: 20
      plugins: ["obstacle_layer", "inflation_layer"]   # voxel_layer disabled until LIDAR-only baseline is proven
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: True
        combination_method: 1   # max — prevents over-inflation when obstacles overlap
        scan:
          topic: /scan
          obstacle_max_range: 10.0
          obstacle_min_range: 0.15
          raytrace_max_range: 10.0
          raytrace_min_range: 0.1
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: False
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: True
        max_obstacle_height: 2.0
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        observation_sources: pointcloud
        combination_method: 1
        pointcloud:
          topic: /zed/zed_node/point_cloud/cloud_registered
          max_obstacle_height: 2.0
          min_obstacle_height: 0.10    # filter ground/grass texture outdoors
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 1.0          # smooth potential field beyond robot edge
        cost_scaling_factor: 1.0       # gentle slope — paths stay mid-corridor
        inflate_unknown: false
        inflate_around_unknown: true
      always_send_full_costmap: True
      introspection_mode: "disabled"

local_costmap:
  local_costmap:
    ros__parameters:
      footprint_padding: 0.03
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[-0.40, -0.51], [-0.40, 0.51], [0.40, 0.51], [0.40, -0.51]]"
      plugins: ["obstacle_layer", "inflation_layer"]   # voxel_layer disabled until LIDAR-only baseline is proven
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: True
        combination_method: 1
        scan:
          topic: /scan
          obstacle_max_range: 3.0        # shorter than global — local costmap is 3×3m
          obstacle_min_range: 0.15
          raytrace_max_range: 3.5
          raytrace_min_range: 0.1
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: False
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: True
        max_obstacle_height: 2.0
        publish_voxel_map: False         # no debug publish on local — save bandwidth
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        observation_sources: pointcloud
        combination_method: 1
        pointcloud:
          topic: /zed/zed_node/point_cloud/cloud_registered
          max_obstacle_height: 2.0
          min_obstacle_height: 0.10
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 1.0
        cost_scaling_factor: 1.0
        inflate_unknown: false
        inflate_around_unknown: true
      always_send_full_costmap: True
      introspection_mode: "disabled"
