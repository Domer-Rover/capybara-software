# Capybara custom object detection configuration for the ZED SDK.
#
# Loaded by the ZED wrapper when detection_model is 'CUSTOM_YOLOLIKE_BOX_OBJECTS'.
# The ONNX file is produced by running:
#   python3 yolov8_export_onnx.py --model yolov8n-oiv7.pt
# which exports yolov8n-oiv7.pt → /home/jetsonson/capybara-software/models/yolov8n-oiv7.onnx
#
# Open Images v7 class IDs referenced below:
#   57  = Bottle       (covers water bottles)
#   234 = Hammer
#
# The ZED SDK only processes classes explicitly listed here — all other OIV7 classes
# are ignored, so the 599-class overhead has no effect on runtime.

/**:
  ros__parameters:
    object_detection:
      # ── ONNX model ─────────────────────────────────────────────────────────
      custom_onnx_file: '/home/jetsonson/capybara-software/models/yolov8n-oiv7.onnx'
      custom_onnx_input_size: 640   # YOLOv8 default export resolution (1x3x640x640)

      # Number of classes in the ONNX file (601 for Open Images v7 yolov8n-oiv7)
      custom_class_count: 601

      # ── Water bottle (OIV7 class 57) ────────────────────────────────────────
      class_057:
        label: 'water bottle'
        model_class_id: 57
        enabled: true
        confidence_threshold: 50.0
        is_grounded: true
        is_static: false
        tracking_timeout: -1.0
        tracking_max_dist: -1.0
        max_box_width_normalized: -1.0
        min_box_width_normalized: -1.0
        max_box_height_normalized: -1.0
        min_box_height_normalized: -1.0
        max_box_width_meters: -1.0
        min_box_width_meters: -1.0
        max_box_height_meters: -1.0
        min_box_height_meters: -1.0
        object_acceleration_preset: 'DEFAULT'
        max_allowed_acceleration: 100000.0

      # ── Hammer (OIV7 class 234) ──────────────────────────────────────────────
      class_234:
        label: 'hammer'
        model_class_id: 234
        enabled: true
        confidence_threshold: 50.0
        is_grounded: true
        is_static: false
        tracking_timeout: -1.0
        tracking_max_dist: -1.0
        max_box_width_normalized: -1.0
        min_box_width_normalized: -1.0
        max_box_height_normalized: -1.0
        min_box_height_normalized: -1.0
        max_box_width_meters: -1.0
        min_box_width_meters: -1.0
        max_box_height_meters: -1.0
        min_box_height_meters: -1.0
        object_acceleration_preset: 'DEFAULT'
        max_allowed_acceleration: 100000.0
