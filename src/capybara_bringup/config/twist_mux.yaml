# Arbitrates who drives. Highest priority with fresh messages wins; a topic
# goes idle after its timeout and the next priority takes over.
#   joystick: hold the deadman to override Nav2 at any time
#   nav2:     autonomous commands
twist_mux:
  ros__parameters:
    topics:
      joystick:
        topic: joy_vel
        timeout: 0.5
        priority: 100
      nav2:
        topic: nav_vel
        timeout: 0.5
        priority: 10
